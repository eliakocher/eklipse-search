# Builds the p2 update site and publishes it on GitHub Pages: https://eliakocher.github.io/eklipse-search/
# Runs for a version tag (git tag v1.0.2 && git push origin v1.0.2) or by hand (Actions > Update site > Run workflow).
# Each run replaces the site with the build of that commit; Eclipse offers it as an update since its qualifier (the
# build time) is newer.
name: Update site

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, a newer one waits instead of cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
      - name: Add the landing page
        run: cp com.eklipse.search.site/index.html com.eklipse.search.site/target/repository/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: com.eklipse.search.site/target/repository

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
