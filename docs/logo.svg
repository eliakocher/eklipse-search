<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B8BFF"/>
      <stop offset="1" stop-color="#1747B8"/>
    </linearGradient>
    <clipPath id="lens">
      <circle cx="220" cy="220" r="100"/>
    </clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <!-- results inside the lens, the middle one with a match -->
  <g clip-path="url(#lens)">
    <rect x="150" y="166" width="130" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="140" y="210" width="62" height="20" rx="10" fill="#FF9F1C"/>
    <rect x="212" y="210" width="88" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.45"/>
    <rect x="150" y="254" width="110" height="20" rx="10" fill="#FFFFFF" fill-opacity="0.45"/>
  </g>
  <circle cx="220" cy="220" r="120" fill="none" stroke="#FFFFFF" stroke-width="40"/>
  <line x1="312" y1="312" x2="398" y2="398" stroke="#FFFFFF" stroke-width="52" stroke-linecap="round"/>
</svg>
