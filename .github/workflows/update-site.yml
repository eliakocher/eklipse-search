# Builds the p2 update site and publishes it on GitHub Pages: https://eliakocher.github.io/eklipse-search/
# Runs for a version tag matching the project version, e.g. 1.0.3 for 1.0.3-SNAPSHOT:
#   git tag 1.0.3 && git push origin 1.0.3
# Each run replaces the site with the build of that tag. Tags may deploy to Pages thanks to the tag rule *.*.* under
# Settings > Environments > github-pages (only main may by default).
# The plugin and the feature are PGP-signed with the key in the repository secrets MAVEN_GPG_KEY (armored secret key,
# gpg --armor --export-secret-keys <fingerprint>) and MAVEN_GPG_PASSPHRASE. Keep using the same key: Eclipse remembers
# the trusted signer, a new key makes everyone confirm again.
name: Update site

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time, a newer one waits instead of cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version
        run: |
          version=$(grep -m1 '<version>' pom.xml | sed 's:.*<version>\(.*\)</version>.*:\1:')
          if [ "${version%-SNAPSHOT}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the project version $version"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare the signing key
        env:
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          if [ -z "$MAVEN_GPG_KEY" ] || [ -z "$MAVEN_GPG_PASSPHRASE" ]; then
            echo "::error::The repository secrets MAVEN_GPG_KEY and MAVEN_GPG_PASSPHRASE are needed to sign the update site"
            exit 1
          fi
          printf '%s\n' "$MAVEN_GPG_KEY" > "$RUNNER_TEMP/signing-key.asc"
      - name: Build, test and sign
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw -B verify -Psign -Dtycho.pgp.signer.bc.secretKeys="$RUNNER_TEMP/signing-key.asc"
      - name: Add the landing page
        run: cp com.eklipse.search.site/index.html com.eklipse.search.site/target/repository/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: com.eklipse.search.site/target/repository

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
